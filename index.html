<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 MANNAL 한국어 단어 공부 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --primary-color: #FF69B4; --primary-light: #FFC0CB; --primary-dark: #C71585; --bg-default: #FFF0F5; }
        body { background-color: var(--bg-default); font-family: 'Jua', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; color: #333; box-sizing: border-box; }
        .timer-bar { width: 90%; max-width: 400px; text-align: right; margin-bottom: 10px; font-size: 14px; color: var(--primary-dark); font-weight: bold; }
        .card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15); width: 90%; max-width: 400px; text-align: center; border: 4px solid var(--primary-light); margin-bottom: 20px; box-sizing: border-box; }
        #ad-popup, #result-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 20000; justify-content: center; align-items: center; }
        .popup-content, .result-content { background: white; padding: 25px; border-radius: 25px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); animation: popScale 0.25s ease-out; }
        @keyframes popScale { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .result-confirm-btn { font-family: 'Jua', sans-serif; color: white; border: none; padding: 12px 0; border-radius: 15px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 15px; }
        .select-box, .input-box { width: 100%; padding: 12px; font-size: 16px; border-radius: 15px; border: 2px solid var(--primary-color); margin-bottom: 10px; box-sizing: border-box; text-align: center; }
        .start-btn { background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 20px; width: 100%; cursor: pointer; font-size: 18px; margin-top: 10px; }
        .option-btn { background: white; border: 2px solid var(--primary-light); padding: 14px; border-radius: 20px; width: 100%; margin-bottom: 10px; cursor: pointer; text-align: left; padding-left: 20px; }
        .word-highlight { color: var(--primary-dark); font-size: 50px; display: block; margin-bottom: 15px; font-weight: bold; }
        .nav-btn { flex: 1; padding: 10px; border-radius: 15px; border: 1px solid #ccc; font-family: 'Jua', sans-serif; cursor: pointer; background: #fdfdfd; }
    </style>
</head>
<body>

<div class="timer-bar" id="timer-display">다음 보너스 타임까지: 05:00</div>

<div id="intro-screen" class="card">
    <h1>🌸 MANNAL 단어 공부 🌸</h1>
    <select id="sheet-select" class="select-box">
        <option value="all">전체 단어 (all)</option>
        <option value="1과 1항">1과 1항</option><option value="1과 2항">1과 2항</option>
        <option value="2과 1항">2과 1항</option><option value="2과 2항">2과 2항</option>
        <option value="3과 1항">3과 1항</option><option value="3과 2항">3과 2항</option>
        <option value="4과 1항">4과 1항</option><option value="4과 2항">4과 2항</option>
        <option value="5과 1항">5과 1항</option><option value="5과 2항">5과 2항</option>
        <option value="6과 1항">6과 1항</option><option value="6과 2항">6과 2항</option>
        <option value="7과 1항">7과 1항</option><option value="7과 2항">7과 2항</option>
        <option value="8과 1항">8과 1항</option><option value="8과 2항">8과 2항</option>
        <option value="9과 1항">9과 1항</option><option value="9과 2항">9과 2항</option>
        <option value="10과 1항">10과 1항</option><option value="10과 2항">10과 2항</option>
        <option value="11과 1항">11과 1항</option><option value="11과 2항">11과 2항</option>
        <option value="12과 1항">12과 1항</option><option value="12과 2항">12과 2항</option>
        <option value="13과 1항">13과 1항</option><option value="13과 2항">13과 2항</option>
        <option value="14과 1항">14과 1항</option><option value="14과 2항">14과 2항</option>
        <option value="15과 1항">15과 1항</option><option value="15과 2항">15과 2항</option>
        <option value="16과 1항">16과 1항</option><option value="16과 2항">16과 2항</option>
    </select>
    <select id="lang-select" class="select-box">
        <option value="vi">베트남어</option><option value="uz">우즈베크어</option><option value="mn">몽골어</option><option value="en">영어</option>
    </select>
    <input type="number" id="user-timer-input" class="input-box" value="5">
    <button class="start-btn" id="start-game-btn" onclick="prepareGame()" disabled>데이터 로딩 중...</button>
</div>

<div id="ad-popup"><div class="popup-content"><div class="algo-bubble" onclick="closeAdPopup()">광고 닫기 및 계속하기</div></div></div>

<div id="result-popup"><div id="result-card-inner" class="result-content"><div id="result-icon" style="font-size: 55px;"></div><div id="result-message" class="result-text"></div><button id="result-action-btn" class="result-confirm-btn" style="background-color: #FF69B4;" onclick="handleResultModalConfirm()">확인</button></div></div>

<div id="app" class="card" style="display:none;">
    <div id="level-display" class="level-info">Level 1</div>
    <div id="progress-display" style="font-size: 14px; color: var(--primary-dark); margin-bottom: 12px;">진행도: 0 / 1</div>
    <div class="question-text"><span class="word-highlight" id="word-display">단어</span>의 맞는 것을 고르세요~</div>
    <div id="options-container" class="options"></div>
    <button class="nav-btn" onclick="goBackToSetup()">🔄 설정 화면으로</button>
</div>

<script>
    const FILE_ID = "1bIPF2bnDDh2nY9VFAkzwSb-kinS1zNsa";
    let wordData = [], pool = [], currentLang = 'vi', currentLevel = 1, questionsToAnswer = 1, currentQuestionCount = 0, currentCorrectAnswer = "", quizHistory = [], secondsLeft = 300, maxSeconds = 300, timer;

    google.charts.load('current', {packages: ['corechart']});
    google.charts.setOnLoadCallback(() => { document.getElementById('start-game-btn').disabled = false; document.getElementById('start-game-btn').innerText = "시작! 🚀"; });

    /* 📱 뒤로가기 로직: 광고 팝업 시 팝업만 닫기, 아니면 게임 나가기 */
    window.onpopstate = function() {
        if (document.getElementById("ad-popup").style.display === 'flex') {
            closeAdPopup(); // [핵심] 광고만 닫고 게임 유지
            return;
        }
        if (document.getElementById("app").style.display === "block") goBackToSetup();
    };

    function startAdTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            secondsLeft--;
            document.getElementById('timer-display').innerText = `다음 보너스 타임까지: ${Math.floor(secondsLeft/60)}:${String(secondsLeft%60).padStart(2,'0')}`;
            if (secondsLeft <= 0) { document.getElementById('ad-popup').style.display = 'flex'; clearInterval(timer); }
        }, 1000);
    }

    function closeAdPopup() { document.getElementById('ad-popup').style.display = 'none'; secondsLeft = maxSeconds; startAdTimer(); }

    function prepareGame() {
        const sheetName = document.getElementById('sheet-select').value;
        currentLang = document.getElementById('lang-select').value;
        new google.visualization.Query(`https://docs.google.com/spreadsheets/d/${FILE_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&headers=1`).send(res => {
            const dt = res.getDataTable();
            wordData = [];
            for (let i = 0; i < dt.getNumberOfRows(); i++) wordData.push({ ko: dt.getValue(i, 0), vi: dt.getValue(i, 1), en: dt.getValue(i, 4), emoji: '💡' });
            pool = [...wordData]; // [핵심] 데이터 로딩 시 단어 주머니 생성
            document.getElementById("intro-screen").style.display = "none";
            document.getElementById("app").style.display = "block";
            generateWordQuestion();
            startAdTimer();
        });
    }

    function generateWordQuestion() {
        if (pool.length === 0) pool = [...wordData]; // [핵심] 다 풀었으면 다시 채우기
        const idx = Math.floor(Math.random() * pool.length);
        const correctTarget = pool[idx];
        pool.splice(idx, 1); // [핵심] 뽑은 단어 제거 (정답/오답 무관)
        
        currentCorrectAnswer = correctTarget[document.getElementById('lang-select').value];
        document.getElementById("word-display").innerHTML = `${correctTarget.emoji} ${correctTarget.ko}`;
        
        let options = [currentCorrectAnswer, ...wordData.filter(i => i[currentLang] !== currentCorrectAnswer).sort(() => 0.5 - Math.random()).slice(0, 3).map(i => i[currentLang])].sort(() => 0.5 - Math.random());
        const container = document.getElementById("options-container");
        container.innerHTML = "";
        options.forEach(o => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = o;
            btn.onclick = () => {
                const correct = (o === currentCorrectAnswer);
                document.getElementById("result-card-inner").className = `result-content ${correct ? 'correct-style' : 'incorrect-style'}`;
                document.getElementById("result-icon").innerText = correct ? "✔️" : "❌";
                document.getElementById("result-message").innerText = correct ? "정답입니다!" : "오답입니다.";
                document.getElementById("result-popup").style.display = "flex";
                window.isCorrect = correct;
            };
            container.appendChild(btn);
        });
    }

    function handleResultModalConfirm() {
        document.getElementById("result-popup").style.display = "none";
        if (window.isCorrect) {
            currentQuestionCount++;
            if (currentQuestionCount >= questionsToAnswer) { currentLevel++; questionsToAnswer++; currentQuestionCount = 0; }
        }
        generateWordQuestion();
    }

    function goBackToSetup() {
        document.getElementById("app").style.display = "none";
        document.getElementById("intro-screen").style.display = "block";
        clearInterval(timer);
    }
    
    window.onload = () => window.history.pushState({ page: "setup" }, "", "");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 MANNAL 한국어 단어 공부 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root {
            --primary-color: #FF69B4;
            --primary-light: #FFC0CB;
            --primary-dark: #C71585;
            --bg-default: #FFF0F5;
        }
        body { 
            background-color: var(--bg-default); 
            font-family: 'Jua', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px 0; 
            color: #333; 
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }
        .card { background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15); width: 90%; max-width: 400px; text-align: center; border: 4px solid var(--primary-light); margin-bottom: 20px; box-sizing: border-box; }
        h1 { color: var(--primary-dark); font-size: 26px; margin-top: 0; margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(255, 182, 193, 0.5); }
        h3 { font-size: 16px; color: #555; margin-top: 15px; margin-bottom: 8px; text-align: left; }

        /* 🟢🔴 정답, 오답, 레벨업 공용 팝업 모달 스타일 레이아웃 (image_15ae4a.png 양식 완전 이식) */
        #result-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 20000; justify-content: center; align-items: center; }
        .result-content { background: white; padding: 25px; border-radius: 25px; width: 75%; max-width: 260px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); animation: popScale 0.25s ease-out; }
        
        /* 📋 [추가] 과별 문제를 모두 풀었을 때 발생하는 최종 학습 결과 리포트 전용 팝업 스타일 */
        #report-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 30000; justify-content: center; align-items: center; }
        .report-content { background: white; padding: 25px; border-radius: 25px; width: 85%; max-width: 340px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: popScale 0.25s ease-out; box-sizing: border-box; }
        .report-title { font-size: 22px; color: var(--primary-dark); font-weight: bold; text-align: center; margin-bottom: 15px; }
        .report-body { font-size: 15px; line-height: 1.6; color: #333; max-height: 250px; overflow-y: auto; background: #fafafa; padding: 12px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 15px; font-family: sans-serif; }
        .report-btn-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .report-btn { font-family: 'Jua', sans-serif; border: none; padding: 11px; border-radius: 15px; font-size: 15px; cursor: pointer; text-align: center; width: 100%; color: white; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); transition: background 0.2s; }

        @keyframes popScale { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .result-icon-box { font-size: 55px; line-height: 1; margin-bottom: 12px; }
        .result-text { font-size: 20px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }
        .result-confirm-btn { font-family: 'Jua', sans-serif; color: white; border: none; padding: 12px 0; border-radius: 15px; font-size: 18px; cursor: pointer; width: 100%; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); }
        
        /* 정오답 및 레벨업 상태별 확장 스킨 클래스 명세 */
        .result-content.correct-style { border: 4px solid #a3e9a4; background-color: #f1fbf1; }
        .result-content.correct-style .result-text { color: #2e7d32; }
        .result-content.correct-style .result-confirm-btn { background-color: #4caf50; }
        .result-content.correct-style .result-confirm-btn:hover { background-color: #388e3c; }
        
        .result-content.incorrect-style { border: 4px solid #ffb3b3; background-color: #fff5f5; }
        .result-content.incorrect-style .result-text { color: #c62828; }
        .result-content.incorrect-style .result-confirm-btn { background-color: #e53935; }
        .result-content.incorrect-style .result-confirm-btn:hover { background-color: #b71c1c; }

        /* ✨ [추가] 축하 상자 레벨업 비주얼 테마 클래스 명세 (image_216986.png 커스텀 모달 업그레이드) */
        .result-content.level-up-style { border: 4px solid #ffd54f; background-color: #fffde7; }
        .result-content.level-up-style .result-text { color: #f57f17; }
        .result-content.level-up-style .result-confirm-btn { background-color: #ffb300; }
        .result-content.level-up-style .result-confirm-btn:hover { background-color: #ff8f00; }

        /* 공통 UI 요소 */
        .select-box { font-family: 'Jua', sans-serif; width: 100%; padding: 12px; font-size: 16px; border-radius: 15px; border: 2px solid var(--primary-color); background-color: white; color: #333; outline: none; margin-bottom: 10px; box-sizing: border-box; }
        
        .start-btn { font-family: 'Jua', sans-serif; background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 20px; font-size: 18px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3); margin-top: 10px; width: 100%; }
        .start-btn:hover { background: var(--primary-dark); }
        .start-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        
        .level-info { background: #FFE4E1; color: var(--primary-dark); padding: 6px 15px; border-radius: 20px; display: inline-block; font-size: 15px; margin-bottom: 15px; }
        .question-text { font-size: 24px; font-weight: bold; color: #222; margin-bottom: 20px; line-height: 1.4; }
        .word-highlight { color: var(--primary-dark); font-size: 30px; display: block; margin-bottom: 5px; }
        .options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        button.option-btn { font-family: 'Jua', sans-serif; background: white; color: #333; border: 2px solid var(--primary-light); padding: 14px; border-radius: 20px; font-size: 16px; cursor: pointer; transition: all 0.2s; text-align: left; padding-left: 20px; }
        button.option-btn:hover { background: #FFF0F5; border-color: var(--primary-color); }

        /* 🎨 색상 커스텀 패널 관련 스타일 */
        .color-picker-section { border: 2px dashed var(--primary-light); padding: 12px; border-radius: 20px; margin-top: 15px; background: #fafafa; }
        .color-palette { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .color-chip { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .color-chip:hover { transform: scale(1.15); }
        .custom-color-row { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: #666; }
        .picker-input { border: none; width: 40px; height: 30px; cursor: pointer; background: none; }

        .copyright { font-size: 11px; color: #bbb; margin-top: 25px; text-align: center; line-height: 1.5; padding-bottom: 20px; }
        
        .nav-footer { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
        .nav-btn { flex: 1; padding: 10px; border-radius: 15px; border: 1px solid #ccc; font-family: 'Jua', sans-serif; cursor: pointer; background: #fdfdfd; }
    </style>
</head>
<body>

<div id="intro-screen" class="card">
    <h1>🌸 MANNAL 단어 공부 🌸</h1>
    <p style="margin-bottom: 20px; color:#666; font-size:15px;">과를 선택하고 퀴즈 도전!</p>
    
    <h3>1. 과</h3>
    <select id="sheet-select" class="select-box">
        <option value="all">전체 단어 (all)</option>
        <option value="1과 1항">1과 1항</option><option value="1과 2항">1과 2항</option>
        <option value="2과 1항">2과 1항</option><option value="2과 2항">2과 2항</option>
        <option value="3과 1항">3과 1항</option><option value="3과 2항">3과 2항</option>
        <option value="4과 1항">4과 1항</option><option value="4과 2항">4과 2항</option>
        <option value="5과 1항">5과 1항</option><option value="5과 2항">5과 2항</option>
        <option value="6과 1항">6과 1항</option><option value="6과 2항">6과 2항</option>
        <option value="7과 1항">7과 1항</option><option value="7과 2항">7과 2항</option>
        <option value="8과 1항">8과 1항</option><option value="8과 2항">8과 2항</option>
        <option value="9과 1항">9과 1항</option><option value="9과 2항">9과 2항</option>
        <option value="10과 1항">10과 1항</option><option value="10과 2항">10과 2항</option>
        <option value="11과 1항">11과 1항</option><option value="11과 2항">11과 2항</option>
        <option value="12과 1항">12과 1항</option><option value="12과 2항">12과 2항</option>
        <option value="13과 1항">13과 1항</option><option value="13과 2항">13과 2항</option>
        <option value="14과 1항">14과 1항</option><option value="14과 2항">14과 2항</option>
        <option value="15과 1항">15과 1항</option><option value="15과 2항">15과 2항</option>
        <option value="16과 1항">16과 1항</option><option value="16과 2항">16과 2항</option>
    </select>

    <h3>2. 언어.</h3>
    <select id="lang-select" class="select-box">
        <option value="vi">베트남어 (Tiếng Việt)</option>
        <option value="uz">우즈베크어 (O'zbekcha)</option>
        <option value="mn">몽골어 (Монгол хэл)</option>
        <option value="en">영어 (English)</option>
    </select>

    <div class="color-picker-section">
        <div style="font-size:14px; color:#444; margin-bottom:8px; font-weight:bold; text-align:left;">🎨 색깔</div>
        <div class="color-palette">
            <div class="color-chip" style="background-color: #FFF0F5;" onclick="changeBg('#FFF0F5')"></div>
            <div class="color-chip" style="background-color: #E0F8F5;" onclick="changeBg('#E0F8F5')"></div>
            <div class="color-chip" style="background-color: #E0F0F8;" onclick="changeBg('#E0F0F8')"></div>
            <div class="color-chip" style="background-color: #FFFDE0;" onclick="changeBg('#FFFDE0')"></div>
            <div class="color-chip" style="background-color: #F5F6F8;" onclick="changeBg('#F5F6F8')"></div>
        </div>
        <div class="custom-color-row">
            <span>사용자 지정 색상 고르기:</span>
            <input type="color" id="bg-color-picker" class="picker-input" value="#FFF0F5" oninput="changeBg(this.value)">
        </div>
    </div>

    <button class="start-btn" id="start-game-btn" onclick="prepareGame()" disabled>데이터 로딩 중... 잠시만 기다려주세요 ⏳</button>
</div>

<div id="result-popup">
    <div id="result-card-inner" class="result-content">
        <div id="result-icon" class="result-icon-box">✔️</div>
        <div id="result-message" class="result-text">정답입니다!</div>
        <button id="result-action-btn" class="result-confirm-btn" onclick="handleResultModalConfirm()">확인</button>
    </div>
</div>

<div id="report-popup">
    <div class="report-content">
        <div class="report-title">🏆 학습 결과</div>
        <div id="report-text-area" class="report-body"></div>
        <div class="report-btn-group">
            <button class="report-btn" style="background-color:#4caf50;" onclick="actionConfirmAndCopy()">확인 (카카오톡 붙여넣기 복사)</button>
            <button id="report-retry-failed-btn" class="report-btn" style="background-color:#e53935;" onclick="actionPlayIncorrectOnly()">📕 오답만 다시 풀기</button>
            <button class="report-btn" style="background-color:#ffb300;" onclick="actionRestartFullQuiz()">🔄 다시 학습</button>
            <button class="report-btn" style="background-color:#757575;" onclick="actionGoMainScreen()">🏠 메인으로</button>
        </div>
    </div>
</div>

<div id="app" class="card" style="display:none;">
    <div class="level-info" id="level-display">Level 1</div>
    <div id="progress-display" style="font-size: 14px; color: var(--primary-dark); margin-bottom: 12px;">진행도: 0 / 1</div>
    
    <div class="question-text">
        <span class="word-highlight" id="word-display">단어</span>
        의 맞는 것을 고르세요~
    </div>
    
    <div class="options" id="options-container"></div>
    <div id="message" style="margin-top:15px; color:var(--primary-dark); font-weight:bold; height:20px;"></div>
    
    <div class="nav-footer">
        <button class="nav-btn" onclick="goBackToSetup()">🔄 설정 화면으로</button>
    </div>
</div>

<div class="copyright">
    Copyright 2026. <b>johnpark236-tech</b> All rights reserved.<br>
    본 소프트웨어의 무단 복제, 수정 및 재배포를 금하며, 발견 시 법적 책임을물 수 있습니다.
</div>

<script>
    /* 🛡️ 도메인 검증 및 출처 제어 고정 */
    if (!window.location.hostname.includes("johnpark236-tech.github.io") && window.location.hostname !== "localhost") {
        alert("이 프로그램은 무단 복제되어 사용할 수 없습니다.\n출처: johnpark236-tech");
        window.location.href = "https://johnpark236-tech.github.io/MANNAL-4_ad/";
    }

    /* 📊 구글 스프레드시트 데이터베이스 링크 연동 구조 */
    const GOOGLE_DRIVE_LINK = "https://docs.google.com/spreadsheets/d/1bIPF2bnDDh2nY9VFAkzwSb-kinS1zNsa/edit?usp=sharing&ouid=101152576649647838712&rtpof=true&sd=true";
    
    function getDriveId(url) {
        let match = url.match(/\/d\/(.+?)\//);
        if (match) return match[1];
        match = url.match(/[?&]id=(.+?)(&|$)/);
        if (match) return match[1];
        return "";
    }
    const FILE_ID = getDriveId(GOOGLE_DRIVE_LINK);

    let wordData = [];         
    let shuffledPool = [];     /* ✨ [추가] 중복 출제 방지용 셔플된 문제 풀 배열 */
    let currentLang = 'vi';    
    let currentLevel = 1; 
    let questionsToAnswer = 1; 
    let currentQuestionCount = 0; 
    let currentCorrectAnswer = "";
    
    /* ⏰ [추가] 총 학습 연산용 시간 카운터 변수 집합 */
    let quizStartTime = null;
    let finalReportText = "";
    let incorrectQueue = [];   /* 📕 오답노트 전용 추출 세션 큐 */
    let isIncorrectOnlyMode = false; /* 현재 세션이 오답 풀이 세션인지 여부 스위치 */

    /* 📝 카카오톡 전송용 테스트 결과 리포트 저장용 메모리 풀 */
    let quizHistory = []; 
    let currentQuestionInfo = { ko: "", target: "", emoji: "" };
    
    /* 🟢🔴 모달 제어용 내부 상태 값 스위치 */
    let isModalCorrectState = false;
    let isLevelUpPending = false;

    // 구글 차트 라이브러리 및 시트 콜백 정의
    google.charts.load('current', {packages: ['corechart']});
    google.charts.setOnLoadCallback(() => {
        const startBtn = document.getElementById('start-game-btn');
        startBtn.disabled = false;
        startBtn.innerText = "시작! 🚀";
    });

    /* 📱 모바일 뒤로가기 버튼 제어 및 다중 연타 방지 트리거 바인딩 */
    function initBackHistory() {
        window.history.pushState({ page: "setup" }, "Setup", "");
    }

    window.onpopstate = function(event) {
        if (document.getElementById("app").style.display === "block" || document.getElementById("report-popup").style.display === "flex") {
            actionGoMainScreen();
            initBackHistory();
        } else {
            if (confirm("한 번 더 누르면 창이 닫힙니다. 프로그램을 종료하시겠습니까?")) {
                window.location.href = "about:blank"; 
            } else {
                initBackHistory(); 
            }
        }
    };

    /* 🎨 실시간 배경색 핸들러 */
    function changeBg(color) {
        document.body.style.backgroundColor = color;
        document.getElementById('bg-color-picker').value = color;
    }

    /* 📋 실시간 테스트 통계 산출 및 클립보드 스크립트 복사 엔진 */
    function copyReportToClipboard() {
        if (quizHistory.length === 0) return;
        
        navigator.clipboard.writeText(finalReportText).then(() => {
            console.log("테스트 레포트가 성공적으로 클립보드에 백업되었습니다.");
        }).catch(err => {
            console.error("클립보드 저장 실패: ", err);
        });
    }

    /* 🚀 게임 초기 설정 및 과별 맞춤형 광고 강제 트리거 지정 */
    function prepareGame() {
        const sheetName = document.getElementById('sheet-select').value;
        currentLang = document.getElementById('lang-select').value;
        
        quizHistory = [];
        isIncorrectOnlyMode = false; /* 일반 시작 시 오답모드 비활성화 */

        if (!FILE_ID) {
            alert("구글 시트 주소가 올바르지 않습니다. 코드를 다시 확인해주세요.");
            return;
        }

        const queryUrl = `https://docs.google.com/spreadsheets/d/${FILE_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&headers=1&tq=${encodeURIComponent("select A,B,C,D,E,F")}&nocache=${new Date().getTime()}`;
        const query = new google.visualization.Query(queryUrl);
        query.send(handleSheetResponse);
    }

    function handleSheetResponse(response) {
        if (response.isError()) {
            alert("스프레드시트 데이터 로딩 실패! 공유 권한 또는 단원 이름을 확인하세요.");
            return;
        }

        const dt = response.getDataTable();
        const rows = dt.getNumberOfRows();
        const cols = dt.getNumberOfColumns();
        wordData = [];

        for (let i = 0; i < rows; i++) {
            const koWord = dt.getValue(i, 0); 
            if (!koWord) continue;

            let emojiValue = '💡';
            if (cols > 5 && dt.getValue(i, 5) != null) {
                let fetchedEmoji = dt.getValue(i, 5).toString().trim();
                if (fetchedEmoji !== '') emojiValue = fetchedEmoji;
            }

            wordData.push({
                ko: koWord.toString().trim(),
                vi: (cols > 1 && dt.getValue(i, 1)) ? dt.getValue(i, 1).toString().trim() : '', 
                uz: (cols > 2 && dt.getValue(i, 2)) ? dt.getValue(i, 2).toString().trim() : '', 
                mn: (cols > 3 && dt.getValue(i, 3)) ? dt.getValue(i, 3).toString().trim() : '', 
                en: (cols > 4 && dt.getValue(i, 4)) ? dt.getValue(i, 4).toString().trim() : '', 
                emoji: emojiValue
            });
        }

        wordData = wordData.filter(item => item[currentLang] !== '');

        if (wordData.length < 4) {
            alert("선택한 단원에 퀴즈를 풀 수 있는 데이터가 부족합니다. (최소 4개 이상의 단어 필요)");
            return;
        }

        /* ✨ 중복 없이 순차 추출하기 위해 원본 데이터를 기반으로 무작위 셔플 풀 생성 */
        shuffledPool = [...wordData].sort(() => 0.5 - Math.random());

        document.getElementById("intro-screen").style.display = "none";
        document.getElementById("app").style.display = "block";
        
        currentLevel = 1;
        questionsToAnswer = 1;
        currentQuestionCount = 0;
        
        quizStartTime = new Date(); /* 학습 시작 시각 스탬프 세팅 */
        generateWordQuestion();
    }

    /* 🎯 4지선다형 객관식 퀴즈 문항 자동 동적 빌드 함수 */
    function generateWordQuestion() {
        /* ✨ 출제 가능한 단어 풀이 바닥난 경우 예외 처리 -> 최종 결과 리포트 팝업 제어 유닛으로 라우팅 */
        if (shuffledPool.length === 0) {
            compileAndShowReport();
            return;
        }

        document.getElementById("message").innerText = "";
        document.getElementById("level-display").innerText = `Level ${currentLevel}`;
        document.getElementById("progress-display").innerText = `현재 레벨 진행도: ${currentQuestionCount} / ${questionsToAnswer}`;

        /* ✨ 무작위 선정이 아닌, 이미 셔플된 풀에서 하나씩 pop() 하여 중복 출제 완전 방지 */
        const correctTarget = shuffledPool.pop();
        currentCorrectAnswer = correctTarget[currentLang];
        
        currentQuestionInfo.ko = correctTarget.ko;
        currentQuestionInfo.target = currentCorrectAnswer;
        currentQuestionInfo.emoji = correctTarget.emoji;

        document.getElementById("word-display").innerHTML = `${correctTarget.emoji} ${correctTarget.ko}`;

        let wrongPool = wordData
            .filter(item => item[currentLang] !== currentCorrectAnswer)
            .map(item => item[currentLang]);
        
        wrongPool = [...new Set(wrongPool)].sort(() => 0.5 - Math.random());
        let selectedWrongs = wrongPool.slice(0, 3);

        while(selectedWrongs.length < 3) {
            selectedWrongs.push("정답 외 옵션 " + (selectedWrongs.length + 1));
        }

        let finalFourOptions = [currentCorrectAnswer, ...selectedWrongs].sort(() => 0.5 - Math.random());

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        finalFourOptions.forEach((optionText, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${idx + 1}. ${optionText}`;
            btn.onclick = () => verifyUserSelection(optionText);
            container.appendChild(btn);
        });
    }

    /* 🔍 유저 정답 확인 연산 로직 함수 */
    function verifyUserSelection(selectedText) {
        const isUserCorrect = (selectedText === currentCorrectAnswer);
        
        quizHistory.push({
            koWord: currentQuestionInfo.ko,
            userChoice: selectedText,
            correctValue: currentQuestionInfo.target,
            isCorrect: isUserCorrect,
            emoji: currentQuestionInfo.emoji
        });

        isModalCorrectState = isUserCorrect;
        isLevelUpPending = false; // 플래그 초기화

        const modal = document.getElementById("result-popup");
        const cardInner = document.getElementById("result-card-inner");
        const iconNode = document.getElementById("result-icon");
        const textNode = document.getElementById("result-message");
        const actionBtn = document.getElementById("result-action-btn");

        // 정답을 맞혔을 때 다음 레벨 달성 유무 사전 판별 계산
        if (isUserCorrect) {
            cardInner.className = "result-content correct-style";
            iconNode.innerText = "✔️";
            textNode.innerText = "정답입니다!";
            
            // 임시 카운트를 계산하여 진급 임계치 도달 여부 확인
            if (currentQuestionCount + 1 >= questionsToAnswer) {
                isLevelUpPending = true;
            }
        } else {
            cardInner.className = "result-content incorrect-style";
            iconNode.innerText = "❌";
            /* 💡 [요구사항 반영] 오답 팝업창 내부에 실제 문항의 올바른 뜻 정답 내용을 가공 명확하게 출력 기입 */
            textNode.innerHTML = `앗! 틀렸어요. 😢<br><br><span style="font-size:14px; display:block; color:#666;">'${currentQuestionInfo.ko}'의 올바른 뜻은</span><span style="color:#2e7d32; font-size:16px; font-weight:bold;">[ ${currentQuestionInfo.target} ]</span> 입니다.`;
        }
        
        // 정오답 모달 활성화 노출
        actionBtn.setAttribute("onclick", "handleResultModalConfirm()");
        modal.style.display = "flex";
    }

    /* 🟢🔴 정답/오답 팝업 내부의 확인 버튼 클릭 시 실질적 트리거 작동부 */
    function handleResultModalConfirm() {
        if (isModalCorrectState) {
            currentQuestionCount++;
            
            /* ✨ 정답 확인 창을 닫은 직후, 레벨업 조건 충족 시 커스텀 축하 모달로 즉시 스위칭 */
            if (isLevelUpPending) {
                isLevelUpPending = false; // 플래그 리셋
                currentLevel++;
                questionsToAnswer = currentLevel; 
                currentQuestionCount = 0;

                const cardInner = document.getElementById("result-card-inner");
                const iconNode = document.getElementById("result-icon");
                const textNode = document.getElementById("result-message");
                const actionBtn = document.getElementById("result-action-btn");

                // 레벨업 스킨 양식으로 모달 콘텐츠 리모델링 (image_216986.png 양식 대치)
                cardInner.className = "result-content level-up-style";
                iconNode.innerText = "🎉";
                textNode.innerText = `축하합니다!<br>다음 레벨 [Level ${currentLevel}]로 진급합니다.`;
                
                // 버튼 이벤트를 레벨업 전용 종료 함수로 변경
                actionBtn.setAttribute("onclick", "handleLevelUpModalConfirm()");
                return; // 모달창을 닫지 않고 유지한 채 리턴
            }
            generateWordQuestion();
        } else {
            currentQuestionCount = 0; 
            generateWordQuestion();
        }
        // 기본 닫기 처리
        document.getElementById("result-popup").style.display = "none";
    }

    /* ✨ [추가] 레벨업 모달창 전용 [확인] 처리 함수 */
    function handleLevelUpModalConfirm() {
        document.getElementById("result-popup").style.display = "none";
        generateWordQuestion(); // 새 레벨 문항 생성 후 플레이 재개
    }

    /* 📊 [추가] 단원 소진 시 성적표 빌드 및 화면 모달 렌더링 핸들러 */
    function compileAndShowReport() {
        document.getElementById("result-popup").style.display = "none";
        document.getElementById("app").style.display = "none";

        const totalQuestions = quizHistory.length;
        const correctCount = quizHistory.filter(item => item.isCorrect).length;
        const failedCount = totalQuestions - correctCount;
        const scoreValue = Math.round((correctCount / totalQuestions) * 100);

        // 시간 계산
        const endTime = new Date();
        const diffMs = endTime - quizStartTime;
        const totalSec = Math.floor(diffMs / 1000);
        const minPart = Math.floor(totalSec / 60);
        const secPart = totalSec % 60;
        const timeString = minPart > 0 ? `${minPart}분 ${secPart}초` : `${secPart}초`;

        // 오답 리스트 수집 및 큐화 (📕 오답만 다시 풀기 세션 베이스용)
        incorrectQueue = [];
        let failedNotesHtml = "";
        let failedNotesText = "";
        let failedIdxCounter = 1;

        quizHistory.forEach((record, index) => {
            if (!record.isCorrect) {
                // 오답 풀 복원을 위한 메타 검색 및 매칭 추출
                const matchedOrigin = wordData.find(w => w.ko === record.koWord);
                if (matchedOrigin) incorrectQueue.push(matchedOrigin);

                failedNotesHtml += `${failedIdxCounter}번 : ${record.koWord}<br>내 답 : <span style="color:#c62828;">${record.userChoice}</span><br>정답 : <span style="color:#2e7d32;">${record.correctValue}</span><br><br>`;
                failedNotesText += `${failedIdxCounter}번 : ${record.koWord}\n내 답 : ${record.userChoice}\n정답 : ${record.correctValue}\n\n`;
                failedIdxCounter++;
            }
        });

        if (failedCount === 0) {
            failedNotesHtml = "🎉 틀린 문제가 없습니다! 완벽합니다.";
            failedNotesText = "🎉 틀린 문제가 없습니다! 완벽합니다.\n";
            document.getElementById("report-retry-failed-btn").style.display = "none";
        } else {
            document.getElementById("report-retry-failed-btn").style.display = "block";
        }

        // 화면 팝업용 내부 HTML 렌더링
        let displayHtml = `점수 : <b>${scoreValue}점</b><br>`;
        displayHtml += `총 문제 : ${totalQuestions}<br>`;
        displayHtml += `정답 : <span style="color:#2e7d32; font-weight:bold;">${correctCount}</span><br>`;
        displayHtml += `오답 : <span style="color:#c62828; font-weight:bold;">${failedCount}</span><br><br>`;
        displayHtml += `⏱️ 학습 시간 : ${timeString}<br>`;
        displayHtml += `────────────────<br><br>`;
        displayHtml += `📕 오답노트<br><br>${failedNotesHtml}`;

        document.getElementById("report-text-area").innerHTML = displayHtml;

        // 클립보드 복사용 원본 텍스트 소스 생성 고정
        finalReportText = `🏆 학습 결과\n\n`;
        finalReportText += `점수 : ${scoreValue}점\n`;
        finalReportText += `총 문제 : ${totalQuestions}\n`;
        finalReportText += `정답 : ${correctCount}\n`;
        finalReportText += `오답 : ${failedCount}\n\n`;
        finalReportText += `⏱️ 학습 시간 : ${timeString}\n`;
        finalReportText += `────────────────\n\n`;
        finalReportText += `📕 오답노트\n\n${failedNotesText}`;
        finalReportText += `────────────────\n카카오톡 대화방에 붙여넣어 공유해보세요! 💕`;

        document.getElementById("report-popup").style.display = "flex";
    }

    /* 🟢 [추가] 리포트 모달 제어용 콜백 함수 세트 */
    function actionConfirmAndCopy() {
        copyReportToClipboard();
        alert("📋 리포트 내용이 클립보드에 복사되었습니다!\n카카오톡 채팅방에 붙여넣기(Ctrl+V) 하시면 공유할 수 있습니다.");
    }

    function actionPlayIncorrectOnly() {
        if (incorrectQueue.length === 0) return;
        document.getElementById("report-popup").style.display = "none";
        
        quizHistory = [];
        isIncorrectOnlyMode = true;
        
        // 오답 풀을 기준으로 퀴즈 데이터 셔플 재구성
        shuffledPool = [...incorrectQueue].sort(() => 0.5 - Math.random());
        
        document.getElementById("app").style.display = "block";
        currentLevel = 1;
        questionsToAnswer = 1;
        currentQuestionCount = 0;
        
        quizStartTime = new Date();
        generateWordQuestion();
    }

    function actionRestartFullQuiz() {
        document.getElementById("report-popup").style.display = "none";
        quizHistory = [];
        
        // 원본 데이터를 기준으로 전면 재수행 풀 인스턴싱
        shuffledPool = [...wordData].sort(() => 0.5 - Math.random());
        
        document.getElementById("app").style.display = "block";
        currentLevel = 1;
        questionsToAnswer = 1;
        currentQuestionCount = 0;
        
        quizStartTime = new Date();
        generateWordQuestion();
    }

    function actionGoMainScreen() {
        document.getElementById("report-popup").style.display = "none";
        document.getElementById("app").style.display = "none";
        document.getElementById("intro-screen").style.display = "block";
    }

    /* 🔄 초기 화면으로 백헤딩 탈출 처리 함수 */
    function goBackToSetup() {
        document.getElementById("app").style.display = "none";
        document.getElementById("intro-screen").style.display = "block";
    }

    window.onload = () => { 
        initBackHistory(); 
    };
</script>
</body>
</html>
